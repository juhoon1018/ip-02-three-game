<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素猎手 3D · PIXEL HUNTER 3D</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;background:#05070d;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:'Courier New',monospace;color:#8ab;user-select:none;
  }
  #wrap{position:relative;--s:1}
  #game{
    display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    box-shadow:0 0 0 2px #1b2340,0 0 70px #0a1a3a;cursor:crosshair;
  }

  /* ---------------- HUD ---------------- */
  #hud{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #hearts{
    position:absolute;left:calc(8px*var(--s));top:calc(10px*var(--s));
    display:flex;gap:calc(3px*var(--s));
  }
  .heart{
    width:calc(7px*var(--s));height:calc(7px*var(--s));
    background:#33202a;display:block;position:relative;
  }
  .heart.on{background:#ff4d6d;box-shadow:0 0 calc(4px*var(--s)) #ff4d6d}
  .heart.on::after{
    content:'';position:absolute;left:0;top:0;
    width:calc(3px*var(--s));height:calc(2px*var(--s));
    background:#ff9db0;
  }

  #xpbar{
    position:absolute;left:0;top:0;width:100%;height:calc(4px*var(--s));
    background:#0e1728;
  }
  #xpfill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#3fa9f5,#8fd8ff);
    transition:width .08s linear;
  }

  #stats{
    position:absolute;right:calc(9px*var(--s));top:calc(10px*var(--s));
    text-align:right;line-height:1.5;
  }
  #score{
    font-size:calc(11px*var(--s));font-weight:bold;color:#e8f4ff;
    text-shadow:0 0 calc(6px*var(--s)) #2a6bb0;
  }
  #waveinfo{
    font-size:calc(8.5px*var(--s));color:#7fa8d8;
  }

  #dashwrap{
    position:absolute;left:calc(8px*var(--s));bottom:calc(9px*var(--s));
    width:calc(48px*var(--s));height:calc(4px*var(--s));
    background:#152036;border:1px solid #22364f;
  }
  #dashfill{
    height:100%;width:100%;background:#6cf8ff;
    box-shadow:0 0 calc(5px*var(--s)) #6cf8ff;
    transition:width .05s linear;
  }
  #dashwrap.ready{border-color:#3d7f9a}

  #combo{
    position:absolute;left:50%;top:calc(16px*var(--s));
    transform:translateX(-50%);
    font-size:calc(12px*var(--s));font-weight:bold;color:#ffd166;
    text-shadow:0 0 calc(8px*var(--s)) #b06a00;
    opacity:0;transition:opacity .15s;
  }

  #wavetip{
    position:absolute;left:50%;bottom:calc(14px*var(--s));
    transform:translateX(-50%);
    font-size:calc(9px*var(--s));color:#8fb8e0;opacity:0;
    transition:opacity .2s;
  }

  /* ---------------- 覆盖层 ---------------- */
  #overlay{
    position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;
    background:rgba(5,8,16,.88);
    backdrop-filter:blur(1px);
    pointer-events:auto;
  }
  #overlay.hidden{display:none}

  .screen{text-align:center;padding:0 calc(16px*var(--s))}

  .screen h1{
    margin:0;font-size:calc(30px*var(--s));letter-spacing:calc(2px*var(--s));
    color:#4a9eff;text-shadow:0 0 calc(18px*var(--s)) #1b5bb0;
  }
  .screen h2{
    margin:0 0 calc(4px*var(--s));font-size:calc(16px*var(--s));
    color:#ffd166;text-shadow:0 0 calc(10px*var(--s)) #8a5a00;
  }
  .sub{
    margin:calc(4px*var(--s)) 0 calc(18px*var(--s));
    font-size:calc(10px*var(--s));letter-spacing:calc(3px*var(--s));color:#2f5a8f;
  }
  .blink{
    font-size:calc(13px*var(--s));font-weight:bold;color:#fff;
    animation:blink 1s steps(2) infinite;margin:calc(14px*var(--s)) 0;
  }
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}

  .keys{
    font-size:calc(8.5px*var(--s));color:#4a6a8a;line-height:1.9;
    margin-top:calc(14px*var(--s));
  }

  .cards{display:flex;gap:calc(10px*var(--s));justify-content:center}
  .card{
    width:calc(132px*var(--s));padding:calc(12px*var(--s)) calc(8px*var(--s));
    border:2px solid #2a3a5a;background:#111a2e;cursor:pointer;
    transition:transform .08s,border-color .1s,background .1s;
  }
  .card:hover{
    border-color:#6cf8ff;background:#1d3055;transform:translateY(calc(-2px*var(--s)));
  }
  .card-icon{
    width:calc(18px*var(--s));height:calc(18px*var(--s));
    margin:0 auto calc(8px*var(--s));
    background:#6cf8ff;box-shadow:0 0 calc(10px*var(--s)) #2f9fd0;
  }
  .card-name{
    font-size:calc(12px*var(--s));font-weight:bold;color:#fff;
    margin-bottom:calc(7px*var(--s));
  }
  .card-desc{
    font-size:calc(8.5px*var(--s));color:#7f9ab8;line-height:1.5;
    min-height:calc(24px*var(--s));
  }
  .card-key{
    margin-top:calc(8px*var(--s));font-size:calc(9px*var(--s));color:#3a5a8a;
  }

  .bigscore{
    font-size:calc(26px*var(--s));font-weight:bold;color:#ff4d6d;
    margin:calc(6px*var(--s)) 0;
    text-shadow:0 0 calc(16px*var(--s)) #8a0020;
  }
  .statline{font-size:calc(10px*var(--s));color:#7f9ab8;line-height:1.9}

  #hint{
    position:fixed;bottom:5px;left:0;right:0;text-align:center;
    font-size:10px;opacity:.32;pointer-events:none;letter-spacing:1px;
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="xpbar"><div id="xpfill"></div></div>
    <div id="hearts"></div>
    <div id="stats">
      <div id="score">0</div>
      <div id="waveinfo">波次 1 · Lv.1</div>
    </div>
    <div id="combo"></div>
    <div id="dashwrap"><div id="dashfill"></div></div>
    <div id="wavetip"></div>
  </div>

  <div id="overlay"></div>
</div>

<div id="hint">WASD 移动 · 鼠标瞄准 · 左键射击 · 空格冲刺 · P 暂停</div>

<script src="libs/three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script>
(function(){
'use strict';

/* ============================================================
   0. 基础常量
   ============================================================ */
const W = 480, H = 300;
const ARENA = 26;                 // 竞技场半径（方形）
const GROUND_Y = 0.9;             // 瞄准平面高度

const rand   = (a,b)=>a+Math.random()*(b-a);
const randi  = (a,b)=>Math.floor(rand(a,b+1));
const clamp  = (v,a,b)=>v<a?a:v>b?b:v;

const canvas  = document.getElementById('game');
const wrapEl  = document.getElementById('wrap');
const overlay = document.getElementById('overlay');
const heartsEl= document.getElementById('hearts');
const xpFill  = document.getElementById('xpfill');
const scoreEl = document.getElementById('score');
const waveInfoEl = document.getElementById('waveinfo');
const comboEl = document.getElementById('combo');
const dashWrap= document.getElementById('dashwrap');
const dashFill= document.getElementById('dashfill');
const waveTip = document.getElementById('wavetip');

/* ============================================================
   1. 渲染器 / 场景 / 相机
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x05070d, 1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
scene.fog = new THREE.Fog(0x05070d, 30, 66);

const camera = new THREE.PerspectiveCamera(52, W/H, 0.1, 300);
camera.position.set(0, 20, 16);
camera.lookAt(0, 0, 0);

const camBase = new THREE.Vector3(0, 20, 16);
const camGoal = new THREE.Vector3();
const camLook = new THREE.Vector3(0, 0.8, 0);

/* ============================================================
   2. 光照
   ============================================================ */
scene.add(new THREE.AmbientLight(0x8090c0, 1.0));

const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(14, 28, 12);
scene.add(sun);

const rim = new THREE.DirectionalLight(0x4a7cff, 0.55);
rim.position.set(-16, 10, -14);
scene.add(rim);

/* ============================================================
   3. 场景搭建：地面 / 网格 / 围墙
   ============================================================ */
const groundMat = new THREE.MeshLambertMaterial({ color: 0x0d1424 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(96, 96), groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const grid = new THREE.GridHelper(96, 48, 0x22406e, 0x131f34);
grid.position.y = 0.012;
grid.material.transparent = true;
grid.material.opacity = 0.75;
scene.add(grid);

// 竞技场高亮地环
const ringGeo = new THREE.RingGeometry(ARENA*1.02, ARENA*1.06, 48);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x2f6fc0, transparent:true, opacity:0.45, side: THREE.DoubleSide
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI/2;
ring.position.y = 0.03;
scene.add(ring);

// 四面围墙
(function buildWalls(){
  const wallMat = new THREE.MeshLambertMaterial({ color: 0x16294a });
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x2f7fd8 });
  const len = ARENA * 2 + 2;

  const defs = [
    { x: 0, z: -ARENA, ry: 0 },
    { x: 0, z:  ARENA, ry: 0 },
    { x: -ARENA, z: 0, ry: Math.PI/2 },
    { x:  ARENA, z: 0, ry: Math.PI/2 },
  ];
  for(const d of defs){
    const wall = new THREE.Mesh(new THREE.BoxGeometry(len, 1.8, 0.8), wallMat);
    wall.position.set(d.x, 0.9, d.z);
    wall.rotation.y = d.ry;
    scene.add(wall);

    const glow = new THREE.Mesh(new THREE.BoxGeometry(len, 0.1, 0.9), glowMat);
    glow.position.set(d.x, 1.82, d.z);
    glow.rotation.y = d.ry;
    scene.add(glow);
  }
})();

/* ============================================================
   4. 共享几何 / 材质缓存
   ============================================================ */
const geoCache = {};
function boxGeo(w,h,d){
  const k = w+'|'+h+'|'+d;
  if(!geoCache[k]) geoCache[k] = new THREE.BoxGeometry(w,h,d);
  return geoCache[k];
}
const matCache = {};
function lamMat(color){
  if(!matCache[color]) matCache[color] = new THREE.MeshLambertMaterial({ color });
  return matCache[color];
}
const basicMatCache = {};
function glowMat(color){
  if(!basicMatCache[color]) basicMatCache[color] = new THREE.MeshBasicMaterial({ color });
  return basicMatCache[color];
}

const partGeo   = new THREE.BoxGeometry(1,1,1);
const bulletGeo = new THREE.BoxGeometry(0.24,0.24,0.72);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
const ebulletGeo= new THREE.BoxGeometry(0.34,0.34,0.34);
const ebulletMat= new THREE.MeshBasicMaterial({ color: 0xff5a5a });
const gemGeo    = new THREE.OctahedronGeometry(0.24, 0);
const gemMat    = new THREE.MeshBasicMaterial({ color: 0x5ad4ff });
const shadowGeo = new THREE.CircleGeometry(0.72, 12);
const shadowMat = new THREE.MeshBasicMaterial({
  color: 0x000000, transparent:true, opacity:0.38
});

/* ============================================================
   5. 音频
   ============================================================ */
let actx = null;
function initAudio(){
  if(actx) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
}
function sfx(freq, dur, type, vol, slide){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq+slide), t+dur);
  g.gain.setValueAtTime(vol || 0.04, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t+dur+0.02);
}

/* ============================================================
   6. 输入
   ============================================================ */
const keys = Object.create(null);
const mouse = { x: W/2, y: H/2, down:false };

function toCanvas(e){
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width  * W;
  mouse.y = (e.clientY - r.top ) / r.height * H;
}
canvas.addEventListener('mousemove', toCanvas);
canvas.addEventListener('mousedown', e=>{
  e.preventDefault();
  initAudio();
  toCanvas(e);
  mouse.down = true;
});
window.addEventListener('mouseup', ()=> mouse.down = false);
canvas.addEventListener('contextmenu', e=> e.preventDefault());

window.addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(keys[e.code]) return;
  keys[e.code] = true;
  onKeyPress(e.code);
});
window.addEventListener('keyup', e=> keys[e.code] = false);

/* ============================================================
   7. 游戏状态
   ============================================================ */
const ENEMY_DEF = {
  slime  : { hp:2, speed:4.5, r:0.72, color:0x5ad05a, y:0.42, xp:1, contact:1 },
  bat    : { hp:1, speed:8.6, r:0.46, color:0xb06cff, y:1.30, xp:1, contact:1 },
  shooter: { hp:3, speed:4.2, r:0.80, color:0xff9a3c, y:0.70, xp:2, contact:1 },
  tank   : { hp:9, speed:3.0, r:1.10, color:0x4a9eff, y:0.95, xp:3, contact:2 },
};

const UPGRADES = [
  { name:'力 量',  desc:'子弹伤害 +1',             apply:p=>p.dmg+=1 },
  { name:'速 射',  desc:'射速提升 20%',            apply:p=>p.fireRate=Math.max(0.055,p.fireRate*0.8) },
  { name:'散 射',  desc:'额外发射一颗子弹',         apply:p=>p.bullets+=1 },
  { name:'疾 行',  desc:'移动速度 +15%',           apply:p=>p.speed*=1.15 },
  { name:'体 质',  desc:'最大生命 +1，回复 2 点',   apply:p=>{p.maxHp+=1;p.hp=Math.min(p.maxHp,p.hp+2);} },
  { name:'穿 透',  desc:'子弹可多穿透 1 个敌人',    apply:p=>p.pierce+=1 },
  { name:'影 步',  desc:'冲刺冷却 -25%',           apply:p=>p.dashMax*=0.75 },
  { name:'磁 力',  desc:'经验拾取范围 +45%',        apply:p=>p.magnet*=1.45 },
  { name:'高速弹', desc:'子弹飞行速度 +25%',        apply:p=>p.bulletSpeed*=1.25 },
  { name:'急 救',  desc:'立即回复 3 点生命',        apply:p=>p.hp=Math.min(p.maxHp,p.hp+3) },
  { name:'弹 匣',  desc:'射速 +12%，伤害 +1',       apply:p=>{p.fireRate=Math.max(0.055,p.fireRate*0.88);p.dmg+=1;} },
];

const G = {
  state: 'title',
  t: 0,
  wave: 0,
  phase: 'break',
  phaseTimer: 0,
  spawnQueue: [],
  spawnTimer: 0,
  enemies: [], bullets: [], ebullets: [], gems: [], particles: [],
  shake: 0,
  score: 0, kills: 0,
  combo: 0, comboTimer: 0,
  choices: [],
  uid: 1,
};

let P = null;
let playerGroup = null;

function newPlayer(){
  return {
    hp: 5, maxHp: 5,
    speed: 9, dashSpeed: 31,
    fireRate: 0.22, fireTimer: 0,
    dmg: 1, bulletSpeed: 30, pierce: 0, bullets: 1,
    dashCd: 0, dashMax: 1.1, dashTime: 0, dashDir: { x: 0, z: 1 },
    invuln: 0, angle: 0,
    xp: 0, level: 1, xpNext: 5,
    magnet: 3.6,
  };
}

/* ============================================================
   8. 玩家模型
   ============================================================ */
function createPlayerGroup(){
  const g = new THREE.Group();

  // 脚下阴影
  const sh = new THREE.Mesh(shadowGeo, shadowMat);
  sh.rotation.x = -Math.PI/2;
  sh.position.y = 0.03;
  sh.scale.set(0.85,0.85,0.85);
  g.add(sh);

  // 身体
  const body = new THREE.Mesh(boxGeo(0.9,0.9,0.9), lamMat(0x2b5fa8));
  body.position.y = 0.72;
  g.add(body);

  // 胸甲高亮
  const chest = new THREE.Mesh(boxGeo(0.94,0.32,0.94), lamMat(0x3f86e0));
  chest.position.y = 0.85;
  g.add(chest);

  // 头
  const head = new THREE.Mesh(boxGeo(0.72,0.62,0.72), lamMat(0xe2ecf8));
  head.position.y = 1.48;
  g.add(head);

  // 护目镜
  const visor = new THREE.Mesh(boxGeo(0.76,0.2,0.16), glowMat(0x6cf8ff));
  visor.position.set(0, 1.50, 0.38);
  g.add(visor);

  // 背包
  const pack = new THREE.Mesh(boxGeo(0.6,0.6,0.3), lamMat(0x1c3f70));
  pack.position.set(0, 0.8, -0.58);
  g.add(pack);

  // 枪
  const gun = new THREE.Mesh(boxGeo(0.22,0.22,1.0), lamMat(0x8aa0c0));
  gun.position.set(0.46, 0.92, 0.62);
  g.add(gun);

  const gunTip = new THREE.Mesh(boxGeo(0.16,0.16,0.22), glowMat(0xffeeaa));
  gunTip.position.set(0.46, 0.92, 1.18);
  g.add(gunTip);

  // 腿部
  const legL = new THREE.Mesh(boxGeo(0.28,0.4,0.28), lamMat(0x1b3a66));
  legL.position.set(-0.22, 0.2, 0);
  g.add(legL);
  const legR = legL.clone();
  legR.position.x = 0.22;
  g.add(legR);

  return g;
}

/* ============================================================
   9. 敌人模型
   ============================================================ */
function createEnemyMesh(type){
  const d = ENEMY_DEF[type];
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color: d.color });

  // 阴影
  const sh = new THREE.Mesh(shadowGeo, shadowMat);
  sh.rotation.x = -Math.PI/2;
  sh.position.y = 0.03;
  sh.scale.setScalar(d.r * 1.0);
  g.add(sh);

  let wingL = null, wingR = null;

  if(type === 'slime'){
    const b = new THREE.Mesh(boxGeo(1.35,0.8,1.35), bodyMat);
    b.position.y = 0.4;
    g.add(b);

    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x08220c });
    const eL = new THREE.Mesh(boxGeo(0.18,0.18,0.1), eyeMat);
    eL.position.set(-0.26, 0.55, 0.69);
    g.add(eL);
    const eR = eL.clone(); eR.position.x = 0.26; g.add(eR);

  } else if(type === 'bat'){
    const b = new THREE.Mesh(boxGeo(0.7,0.62,0.7), bodyMat);
    b.position.y = 0;
    g.add(b);

    wingL = new THREE.Mesh(boxGeo(0.7,0.1,0.42), bodyMat);
    wingL.position.set(-0.62, 0.08, 0);
    g.add(wingL);

    wingR = new THREE.Mesh(boxGeo(0.7,0.1,0.42), bodyMat);
    wingR.position.set(0.62, 0.08, 0);
    g.add(wingR);

    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffe0ff });
    const eL = new THREE.Mesh(boxGeo(0.12,0.12,0.08), eyeMat);
    eL.position.set(-0.16, 0.08, 0.36);
    g.add(eL);
    const eR = eL.clone(); eR.position.x = 0.16; g.add(eR);

    g.position.y = d.y;

  } else if(type === 'shooter'){
    const b = new THREE.Mesh(boxGeo(1.5,1.25,1.5), bodyMat);
    b.position.y = 0.62;
    g.add(b);

    const core = new THREE.Mesh(boxGeo(0.85,0.5,0.85), lamMat(0x3a1400));
    core.position.y = 0.72;
    g.add(core);

    const barrel = new THREE.Mesh(boxGeo(0.28,0.28,1.0), lamMat(0x8a4a10));
    barrel.position.set(0, 0.72, 1.0);
    g.add(barrel);

    const tip = new THREE.Mesh(boxGeo(0.34,0.34,0.16), glowMat(0xffe066));
    tip.position.set(0, 0.72, 1.5);
    g.add(tip);

  } else if(type === 'tank'){
    const b = new THREE.Mesh(boxGeo(2.2,1.6,2.2), bodyMat);
    b.position.y = 0.8;
    g.add(b);

    const armor = new THREE.Mesh(boxGeo(1.6,1.75,1.6), lamMat(0x8ccfff));
    armor.position.y = 0.85;
    g.add(armor);

    const face = new THREE.Mesh(boxGeo(1.0,0.7,0.2), lamMat(0x03224a));
    face.position.set(0, 1.0, 1.1);
    g.add(face);

    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const eL = new THREE.Mesh(boxGeo(0.2,0.2,0.1), eyeMat);
    eL.position.set(-0.24, 1.05, 1.2);
    g.add(eL);
    const eR = eL.clone(); eR.position.x = 0.24; g.add(eR);

    const gem = new THREE.Mesh(boxGeo(0.3,0.3,0.3), glowMat(0xaee4ff));
    gem.position.set(0, 1.85, 0);
    g.add(gem);
  }

  return { group: g, bodyMat, wingL, wingR };
}

/* ============================================================
   10. 粒子 / 文字飘字
   ============================================================ */
function spawnParticle(x,y,z,color,vx,vy,vz,life,size){
  if(G.particles.length > 230) return;
  const m = new THREE.Mesh(partGeo, glowMat(color));
  m.position.set(x,y,z);
  m.scale.setScalar(size);
  scene.add(m);
  G.particles.push({
    mesh: m, vx, vy, vz,
    life, maxLife: life, size
  });
}

function burst(x,y,z,color,count,power,life,size){
  for(let i=0;i<count;i++){
    spawnParticle(
      x, y, z, color,
      rand(-power,power), rand(-power*0.6,power*0.9), rand(-power,power),
      rand(life*0.6,life), rand(size*0.6,size*1.25)
    );
  }
}

function updateParticles(dt){
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.life -= dt;
    if(p.life <= 0){
      scene.remove(p.mesh);
      G.particles.splice(i,1);
      continue;
    }
    p.vy -= 17*dt;
    p.mesh.position.x += p.vx*dt;
    p.mesh.position.y += p.vy*dt;
    p.mesh.position.z += p.vz*dt;

    if(p.mesh.position.y < 0.08){
      p.mesh.position.y = 0.08;
      p.vy *= -0.34;
      p.vx *= 0.7;
      p.vz *= 0.7;
    }
    const k = clamp(p.life/p.maxLife, 0, 1);
    p.mesh.scale.setScalar(p.size * (0.35 + k*0.75));
  }
}

/* ============================================================
   11. 瞄准
   ============================================================ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const aimPlane = new THREE.Plane(new THREE.Vector3(0,1,0), -GROUND_Y);
const aimPoint = new THREE.Vector3();

function updateAim(){
  if(!playerGroup) return;
  ndc.x = (mouse.x / W) * 2 - 1;
  ndc.y = -(mouse.y / H) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.ray.intersectPlane(aimPlane, aimPoint);
  if(hit){
    const dx = aimPoint.x - playerGroup.position.x;
    const dz = aimPoint.z - playerGroup.position.z;
    if(dx*dx + dz*dz > 0.0001){
      P.angle = Math.atan2(dx, dz);
    }
  }
}

/* ============================================================
   12. 玩家更新
   ============================================================ */
function tryDash(){
  if(!playerGroup || G.state !== 'playing') return;
  if(P.dashCd > 0 || P.dashTime > 0) return;

  let ix = 0, iz = 0;
  if(keys.KeyW || keys.ArrowUp)    iz -= 1;
  if(keys.KeyS || keys.ArrowDown)  iz += 1;
  if(keys.KeyA || keys.ArrowLeft)  ix -= 1;
  if(keys.KeyD || keys.ArrowRight) ix += 1;

  if(ix === 0 && iz === 0){
    ix = Math.sin(P.angle);
    iz = Math.cos(P.angle);
  }
  const l = Math.hypot(ix, iz) || 1;
  P.dashDir.x = ix / l;
  P.dashDir.z = iz / l;
  P.dashTime = 0.14;
  P.dashCd = P.dashMax;
  P.invuln = Math.max(P.invuln, 0.22);
  G.shake = Math.max(G.shake, 3);
  sfx(240, 0.14, 'sawtooth', 0.04, 420);
}

function shoot(){
  const n = P.bullets;
  const spread = 0.10;
  const px = playerGroup.position.x;
  const pz = playerGroup.position.z;

  for(let i=0;i<n;i++){
    const a = P.angle + (i - (n-1)/2) * spread;
    const dx = Math.sin(a), dz = Math.cos(a);
    const mesh = new THREE.Mesh(bulletGeo, bulletMat);
    mesh.position.set(px + dx*1.0, 0.95, pz + dz*1.0);
    mesh.rotation.y = a;
    scene.add(mesh);

    G.bullets.push({
      mesh,
      vel: new THREE.Vector3(dx, 0, dz).multiplyScalar(P.bulletSpeed),
      dmg: P.dmg,
      pierce: P.pierce,
      life: 1.7,
      hit: new Set(),
    });
  }

  const mx = px + Math.sin(P.angle) * 1.25;
  const mz = pz + Math.cos(P.angle) * 1.25;
  burst(mx, 0.95, mz, 0xffdd88, 3, 5, 0.18, 0.16);

  G.shake = Math.max(G.shake, 1.15);
  sfx(540, 0.05, 'square', 0.026, -300);
}

function updatePlayer(dt){
  let ix = 0, iz = 0;
  if(keys.KeyW || keys.ArrowUp)    iz -= 1;
  if(keys.KeyS || keys.ArrowDown)  iz += 1;
  if(keys.KeyA || keys.ArrowLeft)  ix -= 1;
  if(keys.KeyD || keys.ArrowRight) ix += 1;

  const len = Math.hypot(ix, iz);
  if(len > 0){ ix /= len; iz /= len; }

  if(P.dashTime > 0){
    P.dashTime -= dt;
    playerGroup.position.x += P.dashDir.x * P.dashSpeed * dt;
    playerGroup.position.z += P.dashDir.z * P.dashSpeed * dt;

    if(Math.random() < 0.85){
      spawnParticle(
        playerGroup.position.x, 0.55, playerGroup.position.z,
        0x6cf8ff, rand(-2,2), rand(0,3), rand(-2,2), 0.28, 0.22
      );
    }
  } else {
    playerGroup.position.x += ix * P.speed * dt;
    playerGroup.position.z += iz * P.speed * dt;
  }

  playerGroup.position.x = clamp(playerGroup.position.x, -ARENA+1.2, ARENA-1.2);
  playerGroup.position.z = clamp(playerGroup.position.z, -ARENA+1.2, ARENA-1.2);

  playerGroup.rotation.y = P.angle;

  if(P.dashCd > 0) P.dashCd -= dt;
  if(P.invuln > 0) P.invuln -= dt;

  // 无敌闪烁
  const blink = P.invuln > 0 && Math.floor(G.t*24) % 2 === 0;
  playerGroup.visible = !blink;

  P.fireTimer -= dt;
  if(mouse.down && P.fireTimer <= 0){
    P.fireTimer = P.fireRate;
    shoot();
  }
}

function hurtPlayer(dmg){
  if(P.invuln > 0) return;
  P.hp -= dmg;
  P.invuln = 1.0;
  G.shake = 10;
  G.combo = 0;
  G.comboTimer = 0;

  burst(playerGroup.position.x, 1.0, playerGroup.position.z, 0xff4455, 14, 8, 0.5, 0.2);
  sfx(130, 0.22, 'sawtooth', 0.06, -70);

  if(P.hp <= 0){
    P.hp = 0;
    gameOver();
  }
}

/* ============================================================
   13. 子弹更新
   ============================================================ */
function removeBulletAt(i){
  scene.remove(G.bullets[i].mesh);
  G.bullets.splice(i,1);
}

function updateBullets(dt){
  for(let i=G.bullets.length-1;i>=0;i--){
    const b = G.bullets[i];
    b.mesh.position.x += b.vel.x * dt;
    b.mesh.position.z += b.vel.z * dt;
    b.life -= dt;

    if(b.life <= 0 || Math.abs(b.mesh.position.x) > ARENA+3 || Math.abs(b.mesh.position.z) > ARENA+3){
      removeBulletAt(i);
      continue;
    }

    let dead = false;
    for(let j=G.enemies.length-1;j>=0;j--){
      const e = G.enemies[j];
      if(b.hit.has(e.id)) continue;

      const dx = b.mesh.position.x - e.mesh.position.x;
      const dz = b.mesh.position.z - e.mesh.position.z;
      const rr = e.r + 0.4;

      if(dx*dx + dz*dz < rr*rr){
        b.hit.add(e.id);
        damageEnemy(e, b.dmg, b.vel.x, b.vel.z);

        if(b.pierce > 0) b.pierce--;
        else { removeBulletAt(i); dead = true; }
        break;
      }
    }
    if(dead) continue;
  }

  // 敌人子弹
  for(let i=G.ebullets.length-1;i>=0;i--){
    const b = G.ebullets[i];
    b.mesh.position.x += b.vel.x * dt;
    b.mesh.position.z += b.vel.z * dt;
    b.life -= dt;

    if(b.life <= 0 || Math.abs(b.mesh.position.x) > ARENA+3 || Math.abs(b.mesh.position.z) > ARENA+3){
      scene.remove(b.mesh);
      G.ebullets.splice(i,1);
      continue;
    }

    const dx = b.mesh.position.x - playerGroup.position.x;
    const dz = b.mesh.position.z - playerGroup.position.z;
    if(dx*dx + dz*dz < (0.55 + 0.3) * (0.55 + 0.3)){
      hurtPlayer(b.dmg);
      scene.remove(b.mesh);
      G.ebullets.splice(i,1);
    }
  }
}

/* ============================================================
   14. 敌人
   ============================================================ */
function pickEnemyType(w){
  const pool = [['slime', 10]];
  if(w >= 2) pool.push(['bat', 5 + w*0.8]);
  if(w >= 3) pool.push(['shooter', 3 + w*0.7]);
  if(w >= 5) pool.push(['tank', 2 + w*0.5]);

  let total = 0;
  for(const p of pool) total += p[1];
  let r = Math.random() * total;
  for(const p of pool){ r -= p[1]; if(r <= 0) return p[0]; }
  return 'slime';
}

function spawnPosition(){
  for(let tries=0; tries<12; tries++){
    const ang = rand(0, Math.PI*2);
    const rad = ARENA * rand(0.72, 0.94);
    const x = Math.cos(ang) * rad;
    const z = Math.sin(ang) * rad;
    const dx = x - playerGroup.position.x;
    const dz = z - playerGroup.position.z;
    if(dx*dx + dz*dz > 144) return { x, z };
  }
  const ang = rand(0, Math.PI*2);
  return { x: Math.cos(ang)*ARENA*0.9, z: Math.sin(ang)*ARENA*0.9 };
}

function spawnEnemy(type){
  const d = ENEMY_DEF[type];
  const made = createEnemyMesh(type);
  const g = made.group;
  const pos = spawnPosition();
  g.position.x = pos.x;
  g.position.z = pos.z;
  if(type === 'bat') g.position.y = d.y;
  scene.add(g);

  const hpMul = 1 + (G.wave - 1) * 0.24;
  const hp = Math.max(1, Math.ceil(d.hp * hpMul));

  G.enemies.push({
    id: G.uid++,
    type,
    mesh: g,
    bodyMat: made.bodyMat,
    wingL: made.wingL,
    wingR: made.wingR,
    r: d.r,
    speed: d.speed * (1 + (G.wave - 1) * 0.012),
    hp, maxHp: hp,
    contact: d.contact,
    xp: d.xp,
    kx: 0, kz: 0,
    flashTimer: 0,
    seed: rand(0, 10),
    shootTimer: rand(0.8, 1.8),
    strafe: Math.random() < 0.5 ? 1 : -1,
    baseY: d.y,
  });
}

function damageEnemy(e, dmg, vx, vz){
  e.hp -= dmg;
  e.flashTimer = 0.1;

  const l = Math.hypot(vx, vz) || 1;
  e.kx += (vx / l) * 8;
  e.kz += (vz / l) * 8;

  burst(e.mesh.position.x, e.mesh.position.y + e.baseY*0.8, e.mesh.position.z,
        ENEMY_DEF[e.type].color, 4, 6, 0.3, 0.18);

  if(e.hp <= 0) killEnemy(e);
}

function killEnemy(e){
  const idx = G.enemies.indexOf(e);
  if(idx >= 0) G.enemies.splice(idx,1);
  scene.remove(e.mesh);

  G.kills++;
  G.combo++;
  G.comboTimer = 2.0;

  const mult = 1 + Math.floor(G.combo / 6) * 0.5;
  G.score += Math.round(e.xp * 10 * mult);

  // 掉落经验
  for(let i=0;i<e.xp;i++){
    const m = new THREE.Mesh(gemGeo, gemMat);
    m.position.set(
      e.mesh.position.x + rand(-0.4,0.4),
      0.55,
      e.mesh.position.z + rand(-0.4,0.4)
    );
    scene.add(m);
    G.gems.push({
      mesh: m,
      vx: rand(-3,3), vz: rand(-3,3),
      life: 22,
      seed: rand(0, 10),
    });
  }

  burst(e.mesh.position.x, e.mesh.position.y + e.baseY, e.mesh.position.z,
        ENEMY_DEF[e.type].color, 11, 8, 0.45, 0.22);

  G.shake = Math.max(G.shake, 2.6);
  sfx(rand(190,270), 0.1, 'square', 0.03, -110);
}

function separateEnemies(){
  const list = G.enemies;
  for(let i=0;i<list.length;i++){
    const a = list[i];
    for(let j=i+1;j<list.length;j++){
      const b = list[j];
      const dx = b.mesh.position.x - a.mesh.position.x;
      const dz = b.mesh.position.z - a.mesh.position.z;
      const d2 = dx*dx + dz*dz;
      const minD = a.r + b.r;
      if(d2 < minD*minD && d2 > 0.0001){
        const d = Math.sqrt(d2);
        const push = (minD - d) * 0.5;
        const nx = dx/d, nz = dz/d;
        a.mesh.position.x -= nx*push; a.mesh.position.z -= nz*push;
        b.mesh.position.x += nx*push; b.mesh.position.z += nz*push;
      }
    }
  }
}

function updateEnemies(dt){
  const px = playerGroup.position.x;
  const pz = playerGroup.position.z;

  for(let i=G.enemies.length-1;i>=0;i--){
    const e = G.enemies[i];
    const m = e.mesh;

    const dx = px - m.position.x;
    const dz = pz - m.position.z;
    const dist = Math.hypot(dx, dz) || 1;
    const nx = dx / dist;
    const nz = dz / dist;

    if(e.type === 'shooter'){
      const want = 7.5;
      let mv = 0;
      if(dist > want + 1.6) mv = 1;
      else if(dist < want - 2.2) mv = -1;

      m.position.x += nx * e.speed * mv * dt;
      m.position.z += nz * e.speed * mv * dt;

      m.position.x += -nz * e.speed * 0.5 * dt * e.strafe;
      m.position.z +=  nx * e.speed * 0.5 * dt * e.strafe;

      e.shootTimer -= dt;
      if(e.shootTimer <= 0 && dist < 16){
        e.shootTimer = Math.max(0.7, 1.9 - G.wave * 0.07);

        const bm = new THREE.Mesh(ebulletGeo, ebulletMat);
        bm.position.set(m.position.x + nx*1.1, 0.8, m.position.z + nz*1.1);
        scene.add(bm);
        G.ebullets.push({
          mesh: bm,
          vel: new THREE.Vector3(nx, 0, nz).multiplyScalar(10),
          life: 4.5,
          dmg: 1,
        });
        sfx(320, 0.07, 'sine', 0.02, -120);
      }

    } else if(e.type === 'bat'){
      const t = G.t * 6 + e.seed;
      m.position.x += (nx * e.speed + Math.cos(t) * 3.4) * dt;
      m.position.z += (nz * e.speed + Math.sin(t) * 3.4) * dt;
      m.position.y = e.baseY + Math.sin(G.t*4 + e.seed) * 0.16;

      if(e.wingL){
        e.wingL.rotation.z =  Math.sin(G.t*22 + e.seed) * 0.7;
        e.wingR.rotation.z = -Math.sin(G.t*22 + e.seed) * 0.7;
      }

    } else {
      m.position.x += nx * e.speed * dt;
      m.position.z += nz * e.speed * dt;

      if(e.type === 'slime'){
        const s = 1 + Math.sin(G.t*8 + e.seed) * 0.07;
        m.scale.set(1/s, s, 1/s);
      }
    }

    // 击退
    m.position.x += e.kx * dt;
    m.position.z += e.kz * dt;
    const damp = Math.max(0, 1 - dt*8);
    e.kx *= damp;
    e.kz *= damp;

    // 朝向玩家
    if(e.type !== 'bat'){
      m.rotation.y = Math.atan2(dx, dz);
    }

    // 边界
    m.position.x = clamp(m.position.x, -ARENA+1, ARENA-1);
    m.position.z = clamp(m.position.z, -ARENA+1, ARENA-1);

    // 受击闪白
    if(e.flashTimer > 0){
      e.flashTimer -= dt;
      e.bodyMat.emissive.setHex(0xffffff);
    } else {
      e.bodyMat.emissive.setHex(0x000000);
    }

    // 接触伤害
    if(dist < e.r + 0.6 && P.invuln <= 0){
      hurtPlayer(e.contact);
    }
  }

  separateEnemies();
}

/* ============================================================
   15. 经验宝石
   ============================================================ */
function updateGems(dt){
  const px = playerGroup.position.x;
  const pz = playerGroup.position.z;

  for(let i=G.gems.length-1;i>=0;i--){
    const g = G.gems[i];
    g.life -= dt;

    const dx = px - g.mesh.position.x;
    const dz = pz - g.mesh.position.z;
    const d = Math.hypot(dx, dz) || 1;

    if(d < P.magnet){
      const pull = (1 - d / P.magnet) * 62 + 14;
      g.vx += dx/d * pull * dt;
      g.vz += dz/d * pull * dt;
    }

    g.vx *= (1 - dt*2.6);
    g.vz *= (1 - dt*2.6);

    g.mesh.position.x += g.vx * dt;
    g.mesh.position.z += g.vz * dt;
    g.mesh.position.y = 0.55 + Math.sin(G.t*4 + g.seed) * 0.13;
    g.mesh.rotation.y += dt * 3.2;
    g.mesh.rotation.x += dt * 1.6;

    if(d < 1.15){
      collectGem(g);
      scene.remove(g.mesh);
      G.gems.splice(i,1);
    } else if(g.life <= 0){
      scene.remove(g.mesh);
      G.gems.splice(i,1);
    }
  }
}

function collectGem(g){
  P.xp += 1;
  sfx(680 + Math.random()*220, 0.045, 'square', 0.016);
  spawnParticle(g.mesh.position.x, g.mesh.position.y, g.mesh.position.z,
                0x8fd8ff, 0, 4, 0, 0.3, 0.16);
  if(P.xp >= P.xpNext) levelUp();
}

/* ============================================================
   16. 波次
   ============================================================ */
function startWave(){
  G.wave++;
  G.phase = 'spawn';
  G.spawnTimer = 0.15;

  const w = G.wave;
  const count = Math.min(46, 4 + Math.floor(w * 1.8));
  G.spawnQueue = [];
  for(let i=0;i<count;i++) G.spawnQueue.push(pickEnemyType(w));

  sfx(440, 0.18, 'square', 0.05, -120);
}

function updateWave(dt){
  if(G.phase === 'break'){
    G.phaseTimer -= dt;
    if(G.phaseTimer <= 0) startWave();
    return;
  }

  if(G.phase === 'spawn'){
    G.spawnTimer -= dt;
    if(G.spawnTimer <= 0 && G.spawnQueue.length){
      spawnEnemy(G.spawnQueue.shift());
      G.spawnTimer = Math.max(0.16, 0.52 - G.wave * 0.018);
    }
    if(G.spawnQueue.length === 0) G.phase = 'fight';
  }

  if(G.phase === 'fight' && G.enemies.length === 0){
    G.phase = 'break';
    G.phaseTimer = 2.2;
    G.score += 40 * G.wave;
    sfx(660, 0.1, 'square', 0.04);
    setTimeout(()=> sfx(880, 0.14, 'square', 0.04), 100);
  }
}

/* ============================================================
   17. 升级
   ============================================================ */
function levelUp(){
  P.level++;
  P.xp -= P.xpNext;
  P.xpNext = Math.floor(P.xpNext * 1.32 + 2);

  G.state = 'upgrade';
  G.choices = pickChoices(3);
  showUpgradeScreen();

  sfx(880, 0.13, 'square', 0.05);
  setTimeout(()=> sfx(1180, 0.16, 'square', 0.045), 90);
}

function pickChoices(n){
  const pool = UPGRADES.slice();
  const out = [];
  for(let i=0;i<n && pool.length;i++){
    out.push(pool.splice(Math.floor(Math.random()*pool.length), 1)[0]);
  }
  return out;
}

function chooseUpgrade(i){
  const c = G.choices[i];
  if(!c) return;

  c.apply(P);
  sfx(720, 0.08, 'square', 0.04, 320);

  G.state = 'playing';
  G.choices = [];
  hideOverlay();

  if(P.xp >= P.xpNext) levelUp();
}

/* ============================================================
   18. 流程
   ============================================================ */
function clearWorld(){
  for(const e of G.enemies) scene.remove(e.mesh);
  for(const b of G.bullets) scene.remove(b.mesh);
  for(const b of G.ebullets) scene.remove(b.mesh);
  for(const g of G.gems) scene.remove(g.mesh);
  for(const p of G.particles) scene.remove(p.mesh);

  G.enemies.length = 0;
  G.bullets.length = 0;
  G.ebullets.length = 0;
  G.gems.length = 0;
  G.particles.length = 0;

  if(playerGroup){
    scene.remove(playerGroup);
    playerGroup = null;
  }
}

function startGame(){
  clearWorld();

  G.state = 'playing';
  G.t = 0;
  G.wave = 0;
  G.phase = 'break';
  G.phaseTimer = 1.0;
  G.spawnQueue = [];
  G.spawnTimer = 0;
  G.shake = 0;
  G.score = 0;
  G.kills = 0;
  G.combo = 0;
  G.comboTimer = 0;
  G.choices = [];
  G.uid = 1;

  P = newPlayer();
  playerGroup = createPlayerGroup();
  playerGroup.position.set(0, 0, 0);
  scene.add(playerGroup);

  camera.position.set(0, 20, 16);
  camBase.set(0, 20, 16);

  hideOverlay();
  sfx(520, 0.1, 'square', 0.04, 220);
}

function gameOver(){
  G.state = 'gameover';
  G.shake = 14;
  burst(playerGroup.position.x, 1.0, playerGroup.position.z, 0xff4455, 30, 12, 0.9, 0.26);
  sfx(180, 0.5, 'sawtooth', 0.07, -140);

  if(playerGroup) playerGroup.visible = false;

  showGameOver();
}

/* ============================================================
   19. 覆盖层 UI

  overlay.classList.add('hidden');
  overlay.innerHTML = '';
  overlay.onclick = null;
}

function showTitle(){

  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="screen">
      <h1>像素猎手</h1>
      <p class="sub">P I X E L &nbsp; H U N T E R &nbsp; 3 D</p>
      <p class="blink">点击屏幕开始</p>
      <div class="keys">
        <div>WASD 移动 · 鼠标瞄准 · 左键射击</div>
        <div>空格 冲刺闪避 · P 暂停</div>
        <div>击杀敌人升级 · 三选一强化</div>
      </div>
    </div>`;
  overlay.onclick = ()=>{
    initAudio();
    startGame();
  };
}

function showUpgradeScreen(){
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="screen">
      <h2>等级提升！</h2>
      <p class="sub">选择一项强化</p>
      <div class="cards">
        ${G.choices.map((c,i)=>`
          <div class="card" data-i="${i}">
            <div class="card-icon"></div>
            <div class="card-name">${c.name}</div>
            <div class="card-desc">${c.desc}</div>
            <div class="card-key">[${i+1}]</div>
          </div>
        `).join('')}
      </div>
    </div>`;

  overlay.onclick = (e)=>{
    const card = e.target.closest('.card');
    if(card) chooseUpgrade(parseInt(card.dataset.i, 10));
  };
}

function showPaused(){
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="screen">
      <h2 style="color:#8fd8ff">暂 停</h2>
      <p class="sub">按 P 继续</p>
    </div>`;
  overlay.onclick = ()=>{
    G.state = 'playing';
    hideOverlay();
  };
}

function showGameOver(){
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="screen">
      <h2 style="color:#ff4d6d;text-shadow:0 0 18px #8a0020">游戏结束</h2>
      <div class="bigscore">${G.score}</div>
      <div class="statline">
        抵达波次 ${G.wave} &nbsp;·&nbsp; 击杀 ${G.kills} &nbsp;·&nbsp; 等级 ${P.level}
      </div>
      <p class="blink">点击屏幕 / 按 R 重新开始</p>
    </div>`;
  overlay.onclick = ()=>{
    initAudio();
    startGame();
  };
}

/* ============================================================
   20. 按键事件
   ============================================================ */
function onKeyPress(code){
  initAudio();

  if(code === 'Space'){
    if(G.state === 'title'){ startGame(); return; }
    if(G.state === 'playing'){ tryDash(); return; }
  }

  if(code === 'KeyP' || code === 'Escape'){
    if(G.state === 'playing'){
      G.state = 'paused';
      showPaused();
    } else if(G.state === 'paused'){
      G.state = 'playing';
      hideOverlay();
    }
  }

  if(G.state === 'title' && (code === 'Enter')) startGame();
  if(G.state === 'gameover' && (code === 'Enter' || code === 'KeyR')) startGame();

  if(G.state === 'upgrade'){
    if(code === 'Digit1') chooseUpgrade(0);
    if(code === 'Digit2') chooseUpgrade(1);
    if(code === 'Digit3') chooseUpgrade(2);
  }
}

/* ============================================================
   21. 相机
   ============================================================ */
function updateCamera(dt){
  if(!playerGroup) return;

  camGoal.set(
    playerGroup.position.x,
    20,
    playerGroup.position.z + 16
  );

  const k = 1 - Math.pow(0.0015, dt);
  camBase.lerp(camGoal, k);

  camera.position.copy(camBase);

  if(G.shake > 0.01){
    const s = G.shake * 0.055;
    camera.position.x += rand(-s, s);
    camera.position.y += rand(-s, s);
    camera.position.z += rand(-s, s) * 0.5;
  }

  camLook.set(
    playerGroup.position.x,
    0.9,
    playerGroup.position.z
  );
  camera.lookAt(camLook);
}

/* ============================================================
   22. HUD
   ============================================================ */
const hudCache = { hp:-1, maxHp:-1, score:-1, wave:-1, level:-1, combo:-1, ready:-1 };

function updateHUD(){
  if(!P) return;

  if(P.hp !== hudCache.hp || P.maxHp !== hudCache.maxHp){
    hudCache.hp = P.hp;
    hudCache.maxHp = P.maxHp;
    let s = '';
    for(let i=0;i<P.maxHp;i++){
      s += `<span class="heart${i < P.hp ? ' on' : ''}"></span>`;
    }
    heartsEl.innerHTML = s;
  }

  xpFill.style.width = (clamp(P.xp / P.xpNext, 0, 1) * 100).toFixed(1) + '%';

  if(G.score !== hudCache.score){
    hudCache.score = G.score;
    scoreEl.textContent = G.score;
  }

  const wv = Math.max(1, G.wave);
  if(wv !== hudCache.wave || P.level !== hudCache.level){
    hudCache.wave = wv;
    hudCache.level = P.level;
    waveInfoEl.textContent = '波次 ' + wv + ' · Lv.' + P.level;
  }

  const dashRatio = P.dashCd > 0 ? (1 - P.dashCd / P.dashMax) : 1;
  dashFill.style.width = (dashRatio * 100).toFixed(0) + '%';
  const ready = dashRatio >= 1 ? 1 : 0;
  if(ready !== hudCache.ready){
    hudCache.ready = ready;
    dashWrap.classList.toggle('ready', ready === 1);
  }

  if(G.combo >= 3){
    comboEl.textContent = 'x' + G.combo + ' 连击';
    comboEl.style.opacity = 1;
  } else {
    comboEl.style.opacity = 0;
  }

  if(G.state === 'playing' && G.phase === 'break' && G.wave >= 1){
    waveTip.textContent = '下一波来袭… ' + Math.ceil(G.phaseTimer);
    waveTip.style.opacity = 1;
  } else {
    waveTip.style.opacity = 0;
  }
}

/* ============================================================
   23. 主更新
   ============================================================ */
function update(dt){
  G.t += dt;
  G.shake = Math.max(0, G.shake - dt * 34);

  if(G.comboTimer > 0){
    G.comboTimer -= dt;
    if(G.comboTimer <= 0) G.combo = 0;
  }

  if(G.state === 'playing'){
    updateAim();
    updatePlayer(dt);
    updateBullets(dt);
    updateEnemies(dt);
    updateGems(dt);
    updateWave(dt);
  }

  updateParticles(dt);
  updateCamera(dt);
  updateHUD();
}

/* ============================================================
   24. 渲染循环
   ============================================================ */
let lastT = performance.now();

function loop(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;

  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* ============================================================
   25. 自适应缩放
   ============================================================ */
function resize(){
  const raw = Math.min(
    (window.innerWidth - 16) / W,
    (window.innerHeight - 16) / H
  );
  const s = raw >= 1 ? Math.floor(raw) : Math.max(0.5, raw);

  const dw = Math.round(W * s);
  const dh = Math.round(H * s);

  canvas.style.width  = dw + 'px';
  canvas.style.height = dh + 'px';
  wrapEl.style.width  = dw + 'px';
  wrapEl.style.height = dh + 'px';
  wrapEl.style.setProperty('--s', s);
}
window.addEventListener('resize', resize);
resize();

/* ============================================================
   26. 启动
   ============================================================ */
showTitle();
requestAnimationFrame(loop);

})();
</script>
